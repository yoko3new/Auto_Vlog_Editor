name: Vlogii checks
on:
  push:
    branches: [kang]
  pull_request:
permissions:
  contents: read
jobs:
  local-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core fonts-noto-cjk
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/vlogii tests
      - run: uv run ruff format --check src/vlogii tests
      - run: uv run pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python contracts/validate_examples.py
      - run: python contracts/collaboration/validate_collaboration.py
      - run: python tools/check_docs.py
