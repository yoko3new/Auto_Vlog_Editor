name: Vlogii checks
on:
  push:
    branches: [main, kang, codex/integrate-feng-ui]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core fonts-noto-cjk
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src/vlogii tests tools/check_docs.py tools/export_openapi.py
      - run: uv run ruff format --check src/vlogii tests tools/check_docs.py tools/export_openapi.py
      - run: uv run pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python tools/check_docs.py
      - run: uv run python tools/export_openapi.py --check
