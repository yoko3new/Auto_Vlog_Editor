[project]
name = "vlogii"
version = "0.1.0"
description = "A small, inspectable AI vlog editor with validated timelines and real FFmpeg exports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.75,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "fonttools>=4.50,<5",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "librosa>=0.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]
# Learning new styles from reference reels (tools/style_lab); not needed to make films.
style-lab = ["faster-whisper>=1.1,<2", "yt-dlp>=2025.1.1"]

[project.scripts]
vlogii = "vlogii.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlogii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["media: real FFmpeg integration checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
